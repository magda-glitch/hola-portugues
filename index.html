<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palabras que estoy aprendiendo</title>
  <style>
    :root {
      --bg: #f6f4ee;
      --card: #ffffff;
      --text: #1f2a24;
      --muted: #5b6660;
      --accent: #0a7a4b;
      --border: #e3e0d6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141816;
        --card: #1d2320;
        --text: #e8ece9;
        --muted: #a2aca6;
        --accent: #4cc38a;
        --border: #2c3430;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      line-height: 1.2;
    }

    .subtitulo {
      margin: 0 0 32px;
      color: var(--muted);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 16px 20px;
    }

    li + li {
      border-top: 1px solid var(--border);
    }

    .pt {
      font-weight: 600;
      font-size: 1.15rem;
      color: var(--accent);
    }

    .es {
      color: var(--muted);
      text-align: right;
    }
  </style>
</head>
<body>
  <main>
    <h1>Palabras que estoy aprendiendo</h1>
    <p class="subtitulo">Portugués → español</p>

    <ul>
      <li><span class="pt" lang="pt">obrigado</span> <span class="es">gracias</span></li>
      <li><span class="pt" lang="pt">saudade</span> <span class="es">añoranza, nostalgia</span></li>
      <li><span class="pt" lang="pt">cachorro</span> <span class="es">perro</span></li>
      <li><span class="pt" lang="pt">borracha</span> <span class="es">goma de borrar</span></li>
      <li><span class="pt" lang="pt">esquisito</span> <span class="es">raro, extraño</span></li>
      <li><span class="pt" lang="pt">apelido</span> <span class="es">apodo</span></li>
      <li><span class="pt" lang="pt">polvo</span> <span class="es">pulpo</span></li>
    </ul>
  </main>
</body>
</html>
